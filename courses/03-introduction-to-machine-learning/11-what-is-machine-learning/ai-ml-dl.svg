<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="460" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">AI ⊃ Machine Learning ⊃ Deep Learning</text>

  <!-- AI -->
  <ellipse cx="360" cy="255" rx="330" ry="175" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Artificial Intelligence</text>
  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#1e40af">any technique making machines act "smart" (incl. rule-based systems)</text>

  <!-- ML -->
  <ellipse cx="360" cy="275" rx="235" ry="130" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Machine Learning</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#1e40af">systems that learn rules from data</text>

  <!-- DL -->
  <ellipse cx="360" cy="300" rx="140" ry="80" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2c6b">Deep Learning</text>
  <text x="360" y="314" text-anchor="middle" font-size="11" fill="#0f2c6b">multi-layer neural networks</text>

  <text x="360" y="452" text-anchor="middle" font-size="11" fill="#6b7280">ITPU · Introduction to Machine Learning · Topic 1</text>
</svg>
